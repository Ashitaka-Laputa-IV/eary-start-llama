[project]
name = "eary-start-llama"
version = "0.1.1"
description = "Manage local llama.cpp model servers with a JSON manifest and an interactive TUI."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Ashitaka-Laputa-IV", email = "Ashitaka-Laputa-IV@outlook.com" }
]
requires-python = ">=3.13"
keywords = ["llama.cpp", "gguf", "llm", "cli", "tui"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Utilities",
]
dependencies = [
    "rich>=15.0.0",
    "textual>=8.2.8",
]

[project.urls]
Homepage = "https://github.com/Ashitaka-Laputa-IV/eary-start-llama"
Repository = "https://github.com/Ashitaka-Laputa-IV/eary-start-llama"
Issues = "https://github.com/Ashitaka-Laputa-IV/eary-start-llama/issues"

[project.scripts]
esl = "eary_start_llama:main"
eary-start-llama = "eary_start_llama:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# 只拦真实错误（语法错误、未定义名、未使用导入等），不做风格苛求
select = ["E4", "E7", "E9", "F"]
